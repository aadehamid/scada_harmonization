# Skeleton CI — ruff + the import smoke test. Grows when domain tests land.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync (dev group)
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
