# Golden-slice CI — one check script. No network, no full-dataset jobs.
#
# The gates live in scripts/check.sh, not here, so CI and a local pre-push hook
# run the same things. Add a gate there.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync (dev group)
        run: uv sync --group dev
      - name: Checks
        run: ./scripts/check.sh
