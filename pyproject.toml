[project]
name = "scada-harmonizer"
version = "0.1.0"
description = "Industrial data harmonization & contextualization home lab — multi-site OT/IT/ET data conformed into a Sparkplug B UNS and a Neo4j knowledge graph (Lagos Specialty Chemicals)"
readme = "README.md"
authors = [
    { name = "Hamid Adesokan", email = "aadehamid@gmail.com" }
]
requires-python = ">=3.13"
# pandas: ingestion melts wide TEP to long L0 rows; augmentation/replay operate
# on tabular L0 frames.
dependencies = [
    "pandas>=3.0.5",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.72",
]

[tool.ruff]
# Match the ~100-column style already used across the design docs.
line-length = 100

[tool.ruff.lint]
# Modest, high-signal rule set for a teaching codebase:
#   E/W pycodestyle · F pyflakes · I import sorting · UP modernize · B bugbear (likely bugs)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
